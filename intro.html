<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encaixe da Marca</title>
<style>
  :root{
    --bg:#f2f7f8;
    --surface:#ffffff;
    --ink:#3d454c;
    --ink-soft:#838d93;
    --teal:#29b6d8;
    --teal-bright:#3fd0f2;
    --teal-deep:#10708c;
    --ring:rgba(63,208,242,0.45);
    --shadow:rgba(16,45,56,0.18);
    --orb-a:rgba(63,208,242,0.16);
    --orb-b:rgba(16,112,140,0.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1518;
      --surface:#121b1e;
      --ink:#e9eff1;
      --ink-soft:#8a9aa0;
      --teal:#3fd0f2;
      --teal-bright:#6fe3ff;
      --teal-deep:#157e9b;
      --ring:rgba(111,227,255,0.35);
      --shadow:rgba(0,0,0,0.45);
      --orb-a:rgba(63,208,242,0.14);
      --orb-b:rgba(21,126,155,0.18);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1518;
    --surface:#121b1e;
    --ink:#e9eff1;
    --ink-soft:#8a9aa0;
    --teal:#3fd0f2;
    --teal-bright:#6fe3ff;
    --teal-deep:#157e9b;
    --ring:rgba(111,227,255,0.35);
    --shadow:rgba(0,0,0,0.45);
    --orb-a:rgba(63,208,242,0.14);
    --orb-b:rgba(21,126,155,0.18);
  }

  * { box-sizing:border-box; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .stage{
    position:relative;
    width:100%;
    max-width:900px;
    aspect-ratio:16/10;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:20px;
    background:var(--bg);
  }

  .orb{
    position:absolute;
    border-radius:50%;
    filter:blur(40px);
    pointer-events:none;
  }
  .orb-a{ width:38vmin; height:38vmin; background:var(--orb-a); top:8%; left:6%; animation:drift-a 14s ease-in-out infinite; }
  .orb-b{ width:44vmin; height:44vmin; background:var(--orb-b); bottom:4%; right:4%; animation:drift-b 17s ease-in-out infinite; }
  @keyframes drift-a{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(4%,6%); } }
  @keyframes drift-b{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-5%,-4%); } }

  .rig{
    position:relative;
    width:min(70vmin,480px);
    height:min(30vmin,205px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .piece{
    position:absolute;
    top:50%;
    width:19%;
    height:92%;
    filter:drop-shadow(0 8px 14px var(--shadow));
  }
  .piece svg{ width:100%; height:100%; display:block; }

  .piece-1{ left:50%; transform:translate(calc(-200% - 60vw), -50%); animation:slide-in-1 1s cubic-bezier(.22,.9,.32,1.24) 0.3s forwards; }
  .piece-2{ left:50%; transform:translate(calc(-100% - 60vw), -50%); animation:slide-in-2 1s cubic-bezier(.22,.9,.32,1.24) 1.7s forwards; }
  .piece-3{ left:50%; transform:translate(calc(0% - 60vw), -50%);    animation:slide-in-3 1s cubic-bezier(.22,.9,.32,1.24) 3.1s forwards; }
  .piece-4{ left:50%; transform:translate(calc(100% - 60vw), -50%);  animation:slide-in-4 1s cubic-bezier(.22,.9,.32,1.24) 4.5s forwards; }

  @keyframes slide-in-1{
    0%{ transform:translate(calc(-200% - 60vw), -50%) scale(1); }
    72%{ transform:translate(calc(-200% + 3px), -50%) scale(1); }
    86%{ transform:translate(-200%, -50%) scale(1.12); }
    100%{ transform:translate(-200%, -50%) scale(1); }
  }
  @keyframes slide-in-2{
    0%{ transform:translate(calc(-100% - 60vw), -50%) scale(1); }
    72%{ transform:translate(calc(-100% + 3px), -50%) scale(1); }
    86%{ transform:translate(-100%, -50%) scale(1.12); }
    100%{ transform:translate(-100%, -50%) scale(1); }
  }
  @keyframes slide-in-3{
    0%{ transform:translate(calc(0% - 60vw), -50%) scale(1); }
    72%{ transform:translate(3px, -50%) scale(1); }
    86%{ transform:translate(0%, -50%) scale(1.12); }
    100%{ transform:translate(0%, -50%) scale(1); }
  }
  @keyframes slide-in-4{
    0%{ transform:translate(calc(100% - 60vw), -50%) scale(1); }
    72%{ transform:translate(calc(100% + 3px), -50%) scale(1); }
    86%{ transform:translate(100%, -50%) scale(1.12); }
    100%{ transform:translate(100%, -50%) scale(1); }
  }

  .landing-ring{
    position:absolute;
    top:50%;
    width:8px; height:8px;
    border-radius:50%;
    border:2px solid var(--ring);
    opacity:0;
  }
  .landing-ring-1{ left:22%; animation:ring-pulse-small 0.4s ease-out 1.16s forwards; }
  .landing-ring-2{ left:40%; animation:ring-pulse-small 0.4s ease-out 2.56s forwards; }
  .landing-ring-3{ left:60%; animation:ring-pulse-small 0.4s ease-out 3.96s forwards; }
  .landing-ring-4{ left:78%; animation:ring-pulse-small 0.4s ease-out 5.36s forwards; }
  @keyframes ring-pulse-small{
    0%{ opacity:0.7; transform:translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(7); }
  }

  .impact-ring{
    position:absolute;
    left:50%; top:50%;
    width:10px; height:10px;
    border-radius:50%;
    border:2px solid var(--ring);
    transform:translate(-50%,-50%) scale(1);
    opacity:0;
    animation:ring-pulse 0.6s ease-out 5.6s forwards;
  }
  @keyframes ring-pulse{
    0%{ opacity:0.9; transform:translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(22); }
  }

  .rig{ animation:settle 0.32s ease-out 5.6s; }
  @keyframes settle{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.06); }
    100%{ transform:scale(1); }
  }

  .brandmark{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    animation:reveal-mark 0.35s ease-out 5.7s forwards;
  }
  .brandmark img{ width:100%; height:100%; object-fit:contain; }
  @keyframes reveal-mark{ to{ opacity:1; } }

  .pieces-wrap{ opacity:1; animation:hide-pieces 0.01s linear 5.7s forwards; }
  @keyframes hide-pieces{ to{ opacity:0; } }

  .wordmark{
    margin-top:28px;
    text-align:center;
  }
  .wordmark .line{
    opacity:0;
    transform:translateY(14px);
    display:block;
  }
  .wordmark .l1{
    font-family:'Archivo Black','Arial Black',sans-serif;
    font-size:clamp(1.5rem,4.4vmin,2.4rem);
    color:var(--ink);
    letter-spacing:-0.01em;
    animation:rise 0.55s cubic-bezier(.2,.8,.2,1) 5.95s forwards;
  }
  .wordmark .l2{
    font-family:'Inter',system-ui,sans-serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(1.1rem,3.2vmin,1.7rem);
    background:linear-gradient(135deg,var(--teal-bright),var(--teal-deep));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-top:2px;
    animation:rise 0.55s cubic-bezier(.2,.8,.2,1) 6.15s forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  .replay{
    position:absolute;
    right:18px;
    bottom:18px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    border-radius:999px;
    border:1.5px solid color-mix(in srgb, var(--ink) 22%, transparent);
    background:color-mix(in srgb, var(--surface) 70%, transparent);
    color:var(--ink);
    font:600 0.78rem/1 'Inter',system-ui,sans-serif;
    cursor:pointer;
    opacity:0;
    animation:rise 0.4s ease-out 6.4s forwards;
    backdrop-filter:blur(6px);
  }
  .replay:hover{ border-color:var(--teal); color:var(--teal-deep); }
  .replay svg{ width:13px; height:13px; }

  @media (prefers-reduced-motion: reduce){
    .piece-1,.piece-2,.piece-3,.piece-4,.rig,.brandmark,.pieces-wrap,.wordmark .l1,.wordmark .l2,.impact-ring,
    .landing-ring-1,.landing-ring-2,.landing-ring-3,.landing-ring-4{ animation:none !important; }
    .piece-1,.piece-2,.piece-3,.piece-4{ opacity:0; }
    .pieces-wrap{ opacity:0; }
    .brandmark,.wordmark .l1,.wordmark .l2,.replay{ opacity:1 !important; transform:none !important; }
  }
</style>
